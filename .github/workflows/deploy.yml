name: Deploy production
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Verify website]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: customsignforge-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.CF_AUTO_DEPLOY == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run check
      - run: npm run build:production
      - name: Require scoped deployment token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Confirm checked commit is still main
        id: head
        shell: bash
        run: |
          CHECKED_SHA=$(git rev-parse HEAD)
          CURRENT_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$CHECKED_SHA" = "$CURRENT_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; skip this stale release."
          fi
      - name: Apply additive migrations and deploy checked commit
        if: steps.head.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/run.mjs wrangler d1 migrations apply DB --remote --config deployment/wrangler.jsonc
          node scripts/run.mjs wrangler deploy --config dist-production/server/wrangler.json --tag "$(git rev-parse --short HEAD)" --message "GitHub checked source $(git rev-parse HEAD)"
      - name: Public smoke checks
        if: steps.head.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error https://customsignforge.com/ -o /dev/null
          curl --fail --silent --show-error https://customsignforge.com/get-a-quote/ -o /dev/null
